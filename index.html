<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>grid</title>
</head>

<body>
  <main>
    <h1>grid</h1>

    <p>
      Navigate through the table and check boxes to create a sequence.
    </p>

    <table id="grid">
      <caption>
        3 by 8 music sequence grid
      </caption>

      <thead>
        <tr id="column-headers">
          <th scope="col">Row</th>
        </tr>
      </thead>

      <tbody id="grid-body">
      </tbody>
    </table>

    <!--
      Screen-reader announcements are placed here.
      It is visually hidden, but assistive technology can read it.
    -->
    <div
      id="screen-reader-status"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
